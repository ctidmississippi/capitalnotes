name: Build Capitol Notes
on:
  schedule:
    - cron: "15 11 * * *"   # 11:15 UTC = 5:15 AM Central (6:15 during standard time)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build.py
      - name: Commit updated page
        run: |
          git config user.name "capitol-notes[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add index.html campaigns.html
          git diff --cached --quiet || (git commit -m "Update headlines $(date -u +%F)" && git push)
