<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="The day's biggest political headlines from the wires and the press, in one place.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2300399a'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3EC%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font:bold 13px/1.25 "Courier New",Courier,monospace}
a{color:#000;text-decoration:underline;display:block}
a:hover{color:#00c}
.tl{padding:6px 6px 0;min-height:104px;font-size:11px}
.tl a{margin:0;line-height:12px}
.nav{text-align:center;margin:-18px 0 22px;font-size:14px}.nav a{display:inline;margin:0 8px}.nav a.cur{text-decoration:none;color:#c00}
.hl{text-align:center;font:normal 36px/45px Arial,Helvetica,sans-serif;text-transform:uppercase;margin:34px auto 0;max-width:1000px;padding:0 10px}
.hl a{display:block;font:inherit;margin:0 0 6px}
.hl a.hot{color:#c00}
.logo{text-align:center;font:900 italic 68px/1 Impact,"Arial Black",Arial,sans-serif;letter-spacing:-2px;transform:scaleY(.95);margin:6px 0 34px;text-shadow:5px 5px 4px #888}
.cols{display:flex;padding:0 0 30px}
.col{flex:1 1 33.3%;padding:0 10px;border-right:1px solid #999;min-width:0}
.col:last-child{border-right:0}
.col a{margin:0 0 12px}
.col a.it{font-style:italic}
.col a.hot{color:#c00}
.col hr{border:0;border-top:1px solid #999;margin:0 0 6px}
.foot{text-align:center;font-weight:normal;font-size:11px;color:#444;padding:10px 10px 30px}
.media{border:2px solid #000;margin:10px 10px;padding:6px 10px;column-count:2;column-gap:24px}
.media .mh{display:block;column-span:all;background:#000;color:#fff;font-weight:bold;letter-spacing:1px;padding:2px 8px;margin:-6px -10px 8px}
.media a{display:block;margin:0 0 6px;break-inside:avoid}
@media(max-width:760px){.cols{display:block}.col{border:0;padding:0 8px}.hl{font-size:24px;line-height:30px}.logo{font-size:44px}}
@media(max-width:700px){.media{column-count:1}}
</style></head><body>

<div class="tl">
{{TL}}
</div>

<div class="hl">
{{LEAD}}
</div>

<div class="logo">{{LOGO}}</div>
<div class="nav">{{NAV}}</div>

<div class="media"><span class="mh">{{MEDIA_TITLE}}</span>
{{MEDIA}}
</div>

<div class="cols">
<div class="col">
{{COL1}}
</div>
<div class="col">
{{COL2}}
</div>
<div class="col">
{{COL3}}
</div>
</div>

<div class="foot">{{FOOT}}</div>
</body></html>
